name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: ubuntu-24.04 # Specifically locks in a stable Ubuntu version

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2 # Updated to support modern Node.js

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # Upgraded to version 5 to fix the warning
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
