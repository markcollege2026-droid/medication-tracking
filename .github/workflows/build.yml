name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # MAGIC STEP: Automatically builds the folder tree and moves loose files in the cloud!
    - name: Automatically Structure Kotlin Files
      run: |
        cd medication-tracking
        mkdir -p app/src/main/java/com/campmeds/app/ui
        
        # Move any loose .kt files from the root into the correct folder layout
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/campmeds/app/ \;
        
        echo "Cloud folder structuring complete!"

    - name: Install Gradle Wrapper (If Missing)
      run: |
        cd medication-tracking
        if [ ! -f gradlew ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.7
        fi

    - name: Grant Execute Permission for Gradle
      run: chmod +x medication-tracking/gradlew

    - name: Build App APK
      run: |
        cd medication-tracking
        ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: medication-tracking/app/build/outputs/apk/debug/app-debug.apk
