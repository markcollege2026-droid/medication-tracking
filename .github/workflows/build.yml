name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Sweeps loose files and applies a strictly targeted line-specific text modification
    - name: Automatically Structure Project Files
      run: |
        mkdir -p app/src/main/java/com/campmeds/app
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/campmeds/app/ \;
        
        # Manifest mapping patch
        if [ -f app/src/main/AndroidManifest.xml ]; then
          sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' app/src/main/AndroidManifest.xml
        fi
        
        # PRECISE LINE 48 PATCH: Targets line 48 exactly and safely appends the type cast
        TARGET_FILE="app/src/main/java/com/campmeds/app/XlsxExporter.kt"
        if [ -f "$TARGET_FILE" ]; then
          sed -i '48s/createCellStyle()/createCellStyle() as XSSFCellStyle/' "$TARGET_FILE"
        fi
        
        echo "Project folders structured and line 48 casted precisely!"

    - name: Install Gradle Wrapper (If Missing)
      run: |
        if [ ! -f gradlew ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.7
        fi

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build App APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
