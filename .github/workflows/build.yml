name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Corrected modern 2026 runner

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2 # Keeps the updated checkout code

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # Keeps version 5 to prevent deprecation
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Gradle Wrapper (If Missing)
      run: |
        if [ ! -f gradlew ]; then
          echo "Gradle wrapper missing. Installing standard build tools..."
          gradle wrapper --gradle-version 8.2
        fi

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
